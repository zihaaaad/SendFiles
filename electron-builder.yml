appId: com.zihaaaad.sendfiles
productName: SendFiles
copyright: Copyright © SendFiles contributors

# Tells electron-builder to emit the update manifests (latest.yml,
# latest-linux.yml) that electron-updater reads from the GitHub releases feed.
# Publishing itself is still done by the workflow, not by electron-builder.
publish:
  - provider: github
    owner: zihaaaad
    repo: SendFiles

directories:
  output: release-desktop
  buildResources: build

# Only the Electron shell goes in the asar. The server and the web assets it
# serves are unpacked into resources/server, because the server is spawned as a
# child process and Node cannot execute a file from inside an asar archive.
files:
  - dist-electron/**/*
  - package.json
  - '!**/*.map'
  # esbuild already bundles every dependency into dist-electron/main.cjs and
  # resources/server/server.cjs, so shipping node_modules as well was packaging
  # a second, unused copy of express, redis and the rest.
  - '!node_modules/**/*'

extraResources:
  - from: dist
    to: server
    filter:
      - '**/*'
      - '!*.map'
      - '!package.json'

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
  # Unsigned builds still trip SmartScreen; the portable target exists so users
  # blocked by installer policy have a route that needs no installation.

nsis:
  # Version-less so https://.../releases/latest/download/<name> stays a valid
  # permanent link. The version is shown in the app and on the release page.
  artifactName: SendFiles-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SendFiles

portable:
  artifactName: SendFiles-portable.exe

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Network
  icon: build/icon.png
  artifactName: SendFiles-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.utilities
  icon: build/icon.png
  artifactName: SendFiles-${arch}.${ext}
