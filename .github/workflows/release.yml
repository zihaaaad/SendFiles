name: Build, Test & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # `npm ci` only: falling back to `npm install` silently discards the
      # lockfile exactly when reproducibility matters most.
      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

  build:
    name: Build & Package Standalone Binaries
    runs-on: ubuntu-latest
    needs: verify
    # Release artifacts are only cut for tagged versions; pushes to main just
    # have to pass verification. Previously every push overwrote the shared
    # "latest" release.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Frontend and Backend
        run: npm run build

      - name: Build Standalone Binaries (pkg)
        run: |
          node -e "const fs=require('fs'); fs.writeFileSync('dist/package.json', JSON.stringify({name:'sendfiles',bin:'server.cjs',pkg:{assets:['index.html','assets/**/*','sw.js','favicon.png']}}))"
          npx pkg dist --targets node18-win-x64,node18-linux-x64,node18-macos-x64,node18-macos-arm64 --no-bytecode --public --out-path release
          # Rename standing binaries with safe find checks to handle suffixes
          find release -type f -name "*win*" -exec mv {} release/sendfiles-windows.exe \;
          find release -type f -name "*linux*" -exec mv {} release/sendfiles-linux \;
          find release -type f -name "*macos-x64*" -exec mv {} release/sendfiles-macos-intel \;
          find release -type f -name "*macos-arm64*" -exec mv {} release/sendfiles-macos-silicon \;

      - name: Build Portable Signed ZIP Packages
        run: |
          # Create packaging folder structures
          mkdir -p win-pkg/bin win-pkg/dist
          mkdir -p linux-pkg/bin linux-pkg/dist
          mkdir -p macos-pkg/bin macos-pkg/dist

          # Copy compiled files
          cp -r dist/* win-pkg/dist/
          cp -r dist/* linux-pkg/dist/
          cp -r dist/* macos-pkg/dist/

          # Write Windows start batch script
          cat << 'EOF' > win-pkg/start-windows.bat
          @echo off
          title SendFiles Portable Server
          echo ==================================================
          echo Starting SendFiles Portable Server (Signed Runtime)
          echo ==================================================
          cd /d "%~dp0"
          if not exist "bin\node.exe" (
              echo Error: bin\node.exe not found!
              pause
              exit /b 1
          )
          set NODE_ENV=production
          bin\node.exe dist\server.cjs
          pause
          EOF

          # Write Linux start shell script
          cat << 'EOF' > linux-pkg/start-linux.sh
          #!/bin/bash
          echo "=================================================="
          echo "Starting SendFiles Portable Server (Linux Runtime)"
          echo "=================================================="
          DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" >/dev/null 2>&1 && pwd )"
          cd "$DIR"
          chmod +x bin/node
          export NODE_ENV=production
          bin/node dist/server.cjs
          EOF
          chmod +x linux-pkg/start-linux.sh

          # Write macOS start shell command
          cat << 'EOF' > macos-pkg/start-macos.command
          #!/bin/bash
          echo "=================================================="
          echo "Starting SendFiles Portable Server (macOS Runtime)"
          echo "=================================================="
          DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" >/dev/null 2>&1 && pwd )"
          cd "$DIR"
          chmod +x bin/node
          export NODE_ENV=production
          bin/node dist/server.cjs
          EOF
          chmod +x macos-pkg/start-macos.command

          # Download official Node.js binaries
          NODE_VERSION="v20.12.2"
          
          # Windows node.exe (digitally signed)
          curl -sL "https://nodejs.org/dist/${NODE_VERSION}/win-x64/node.exe" -o win-pkg/bin/node.exe
          
          # Linux node binary
          curl -sL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-x64.tar.xz" -o linux-node.tar.xz
          tar -xf linux-node.tar.xz
          cp node-${NODE_VERSION}-linux-x64/bin/node linux-pkg/bin/node
          rm -rf linux-node.tar.xz node-${NODE_VERSION}-linux-x64
          
          # macOS node binary
          curl -sL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-darwin-x64.tar.gz" -o macos-node.tar.gz
          tar -xf macos-node.tar.gz
          cp node-${NODE_VERSION}-darwin-x64/bin/node macos-pkg/bin/node
          rm -rf macos-node.tar.gz node-${NODE_VERSION}-darwin-x64

          # Zip/Compress portable folders into release output directory
          zip -r release/sendfiles-portable-windows.zip win-pkg
          tar -czf release/sendfiles-portable-linux.tar.gz linux-pkg
          zip -r release/sendfiles-portable-macos.zip macos-pkg

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## SendFiles

            Three ways to run it. Pick whichever suits you.

            ### Option 1: Desktop App (recommended)

            A normal windowed application. It runs the sharing server in the
            background and shows the interface in its own window. Other devices
            on your Wi-Fi connect to the LAN address displayed inside the app.

            | Platform | File |
            | --- | --- |
            | Windows (installer) | `SendFiles-<version>-Setup.exe` |
            | Windows (no install) | `SendFiles-<version>-portable.exe` |
            | Linux | `SendFiles-<version>-x64.AppImage` |
            | macOS | `SendFiles-<version>-<arch>.dmg` |

            These builds are not code-signed. Windows SmartScreen will show
            "Windows protected your PC": choose More info, then Run anyway. On
            macOS, right-click the app and choose Open the first time.

            ### Option 2: Standalone single-file executables

            A console program that starts the server and opens your default
            browser. No installation, but it leaves a terminal window open.

            | Platform | File |
            | --- | --- |
            | Windows | `sendfiles-windows.exe` |
            | Linux | `sendfiles-linux` |
            | macOS (Intel) | `sendfiles-macos-intel` |
            | macOS (Apple Silicon) | `sendfiles-macos-silicon` |

            ### Option 3: Portable packages with an official Node.js runtime

            Use these if your operating system blocks the other options under
            an application control policy such as Windows Defender Application
            Control. They run on an official, signed Node.js binary.

            1. Download and unpack the archive.
            2. Run the launcher: `start-windows.bat`, `start-linux.sh`, or
               `start-macos.command`.

            | Platform | File |
            | --- | --- |
            | Windows | `sendfiles-portable-windows.zip` |
            | Linux | `sendfiles-portable-linux.tar.gz` |
            | macOS | `sendfiles-portable-macos.zip` |

            ### Notes

            If the default port 3000 is already in use, SendFiles moves to the
            next free port and prints the address it chose. Set `PORT` and
            `HTTPS_PORT` to override.
          files: |
            release/sendfiles-windows.exe
            release/sendfiles-linux
            release/sendfiles-macos-intel
            release/sendfiles-macos-silicon
            release/sendfiles-portable-windows.zip
            release/sendfiles-portable-linux.tar.gz
            release/sendfiles-portable-macos.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    name: Electron Desktop (${{ matrix.os }})
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each installer format has to be built on its own OS: NSIS needs
          # Windows and DMG needs macOS. Cross-building them is unreliable.
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          - os: macos-latest
            args: --mac

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets and Server
        run: npm run build

      - name: Build Electron Shell
        run: npm run build:electron

      # Unsigned builds are expected here; SmartScreen and Gatekeeper warnings
      # are covered in the release notes.
      - name: Package Desktop App
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Attach Desktop Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-desktop/*.exe
            release-desktop/*.AppImage
            release-desktop/*.dmg
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
